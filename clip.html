<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="許氏便條">
<meta name="theme-color" content="#16181d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="pad.css">
<title>許氏便條 · Clip Pad</title>
<style>
  /* Split View 下寬度可能只有 ~320px，所以一切從緊 */
  :root{--fs:20px;--cand-fs:19px}
  #top{gap:8px;padding:6px 10px}
  #mode{font-size:14px;padding:2px 10px}
  #status{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status.ok{color:var(--ok);font-weight:600}
  #count{font-size:12px}
  /* 詞庫鈕放頂列：Split View 窄寬時底下工具列多一顆就會折成兩行 */
  #btn-lex{flex:0 0 auto;font-family:inherit;font-size:12px;padding:2px 9px;border-radius:7px;
    border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
  #warn{padding:9px 12px;font-size:13px;line-height:1.5}
  #tip{flex:0 0 auto;display:none;padding:9px 12px;font-size:13px;line-height:1.55;
    background:var(--panel);color:var(--dim);border-bottom:1px solid var(--line)}
  #tip.show{display:block}
  #tip b{color:var(--fg)}
  #tip button{float:right;margin-left:8px;font-family:inherit;font-size:12px;padding:2px 8px;
    border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer}
  #ta{padding:14px 12px;line-height:1.8}
  #cand{padding:7px 8px}
  .cand{gap:4px;padding:5px 9px}
  #tools{gap:6px;padding:7px 10px;padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  #tools button{font-size:13px;padding:7px 11px}
  #auto{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);
    padding:7px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;user-select:none}
  #auto.on{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
  #auto span{font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="mode" type="button">中文</button>
    <span id="status">便條 · 自動複製</span>
    <span id="count">0 字</span>
    <button id="btn-lex" type="button">詞庫</button>
  </div>

  <div id="warn">
    <b>⚠️ 系統輸入法正在攔截按鍵</b><br>
    請把 iPad 輸入來源切成「ABC／英文」：按 <b>🌐</b> 鍵，或 <b>⌃-空白鍵</b>。
  </div>

  <div id="tip">
    <button id="tip-x" type="button">知道了</button>
    <b>用法</b>：把這頁跟目標 App 並排（Split View），在這邊打字，
    每送出一個詞就<b>自動進剪貼簿</b>，切過去 <b>⌘V</b> 就好。
  </div>

  <textarea id="ta" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    placeholder="直接打字。Shift 單擊切中／英。"></textarea>

  <div id="cand"></div>

  <div id="tools">
    <label id="auto" class="on"><span>⏱</span>自動複製</label>
    <button id="btn-copy" type="button">複製</button>
    <button id="btn-cut" type="button">複製並清空</button>
    <button id="btn-clear" type="button">清空</button>
  </div>
</div>

<div id="boot">載入注音引擎…</div>

<script src="vendor/mcbopomofo.bundle.js"></script>
<script src="pad.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), autoEl = $("auto");

  /* ---------- 自動複製 ----------
     能成立的關鍵：pad.js 的 commit()（中文送出）與 input 事件（英文／標點／刪字／貼上）
     都是從 keydown／input 處理器同步呼叫 onChange 的，所以還在使用者手勢裡，Safari 才准寫剪貼簿。
     搬去 setTimeout、blur、visibilitychange 就會被擋 —— 別改。
     踩過：一開始只掛在中文送出，英文模式的按鍵不經引擎，中英夾雜時只複製到中文那段。
     兩條路徑現在都經過 onChange。 */
  var AUTO_KEY = "hsu_clip_auto", autoOn = true;
  try { autoOn = localStorage.getItem(AUTO_KEY) !== "0"; } catch (e) {}

  var copyFailed = false;
  function autoCopy() {
    if (!autoOn) return;
    var t = pad.plainText();
    if (!t) return;
    pad.copy(t, function () {
      copyFailed = false;
      setStatus("✓ 已複製 " + pad.charCount(t) + " 字", true);
    }, function () {
      // 每次輸入都跑，失敗訊息只報一次，不要洗版
      if (copyFailed) return;
      copyFailed = true;
      setStatus("複製失敗，請用「複製」鈕", false);
    });
  }

  var pad = HsuPad.mount({ draftKey: "hsu_clip_draft_v1", onChange: autoCopy });

  function paintAuto() {
    autoEl.className = autoOn ? "on" : "";
    setStatus(autoOn ? "便條 · 自動複製" : "便條 · 手動複製", false);
  }
  autoEl.addEventListener("click", function () {
    autoOn = !autoOn;
    try { localStorage.setItem(AUTO_KEY, autoOn ? "1" : "0"); } catch (e) {}
    paintAuto(); pad.focus();
  });

  var statusTimer = null;
  function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = ok ? "ok" : "";
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    if (ok) statusTimer = setTimeout(paintAuto, 2500);
  }
  paintAuto();

  try { if (localStorage.getItem("hsu_clip_tip") !== "0") $("tip").className = "show"; } catch (e) {}
  $("tip-x").addEventListener("click", function () {
    $("tip").className = "";
    try { localStorage.setItem("hsu_clip_tip", "0"); } catch (e) {}
    pad.focus();
  });

  /* ---------- 工具列 ---------- */
  $("btn-copy").addEventListener("click", function () {
    var t = pad.plainText(); if (!t) return;
    pad.copy(t, function () { setStatus("✓ 已複製 " + pad.charCount(t) + " 字", true); pad.focus(); },
                function () { setStatus("複製失敗", false); });
  });
  $("btn-cut").addEventListener("click", function () {
    var t = pad.plainText(); if (!t) return;
    pad.copy(t, function () {
      pad.clearAll();
      setStatus("✓ 已複製 " + pad.charCount(t) + " 字並清空", true);
    }, function () { setStatus("複製失敗，沒有清空", false); });
  });
  $("btn-clear").addEventListener("click", function () {
    if (!pad.plainText()) return;
    if (!confirm("清空全部文字？")) return;
    pad.clearAll();
  });
  $("btn-lex").addEventListener("click", function () { pad.openLexicon(); });

  if (navigator.serviceWorker) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
