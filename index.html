<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="許氏寫字台">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="pad.css">
<title>許氏寫字台</title>
<style>
  #title{font-size:14px;color:var(--dim);letter-spacing:.06em}
  #hint{margin-left:auto;align-self:center;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="mode" type="button">中文</button>
    <span id="title">許氏寫字台</span>
    <span id="count">0 字</span>
  </div>

  <div id="warn">
    <b>⚠️ 系統輸入法正在攔截按鍵</b><br>
    請把 iPad 輸入來源切成「ABC／英文」：按鍵盤上的 <b>🌐</b> 鍵，或 <b>⌃-空白鍵</b>。
    切好之後這條會自己消失。
  </div>

  <textarea id="ta" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    placeholder="直接打字。Shift 單擊切中／英。"></textarea>

  <div id="cand"></div>

  <div id="tools">
    <button id="btn-copy" type="button">複製全文</button>
    <button id="btn-share" type="button">分享</button>
    <button id="btn-clear" type="button">清空</button>
    <button id="btn-lex" type="button">詞庫</button>
    <span id="hint">Shift 切中英・Shift+← 加詞</span>
  </div>
</div>

<div id="boot">載入注音引擎…</div>

<script src="vendor/mcbopomofo.bundle.js"></script>
<script src="pad.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var pad = HsuPad.mount({ draftKey: "hsu_draft_v1" });

  function flash(btn, msg) {
    var old = btn.textContent; btn.textContent = msg;
    setTimeout(function () { btn.textContent = old; }, 1200);
  }

  $("btn-copy").addEventListener("click", function () {
    var t = pad.plainText();
    if (!t) return;
    pad.copy(t, function () { flash($("btn-copy"), "已複製"); pad.focus(); },
                function () { flash($("btn-copy"), "複製失敗"); });
  });

  $("btn-share").addEventListener("click", function () {
    var t = pad.plainText();
    if (!t) return;
    if (navigator.share) { navigator.share({ text: t }).catch(function () {}); }
    else { flash($("btn-share"), "此瀏覽器不支援"); }
  });

  $("btn-clear").addEventListener("click", function () {
    if (!pad.plainText()) return;
    if (!confirm("清空全部文字？")) return;
    pad.clearAll();
  });

  $("btn-lex").addEventListener("click", function () { pad.openLexicon(); });

  if (navigator.serviceWorker) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
